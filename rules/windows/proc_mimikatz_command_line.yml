title: Mimikatz Command Line Keywords
id: 7c1f2a10-0002-4a5b-9c00-000000000002
status: test
description: Process command line contains Mimikatz module syntax.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Philips Rhoguns
date: 2026-09-22
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
