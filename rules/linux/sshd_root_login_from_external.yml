title: SSH Root Login Accepted From Non-Private Address
id: 7c1f2a10-0010-4a5b-9c00-000000000010
status: test
description: sshd accepted a login for root from an address outside RFC1918 space.
references:
  - https://attack.mitre.org/techniques/T1021/004/
author: Philips Rhoguns
date: 2026-09-22
tags:
  - attack.lateral-movement
  - attack.initial-access
  - attack.t1021.004
logsource:
  product: linux
  service: sshd
detection:
  selection:
    Message|startswith: 'Accepted '
    User: 'root'
  filter_private:
    SourceIp|startswith:
      - '10.'
      - '192.168.'
      - '172.16.'
      - '172.17.'
      - '172.18.'
      - '172.19.'
      - '172.2'
      - '172.30.'
      - '172.31.'
  condition: selection and not filter_private
falsepositives:
  - Bastion hosts intentionally exposed; filter by hostname.
level: high
