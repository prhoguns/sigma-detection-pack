title: Service Account Spawned an Interactive Shell via sudo
id: 7c1f2a10-0011-4a5b-9c00-000000000011
status: test
description: A svc-* account ran sudo to start a shell. Service accounts should never need an interactive root shell.
references:
  - https://attack.mitre.org/techniques/T1548/003/
author: Philips Rhoguns
date: 2026-09-22
tags:
  - attack.privilege-escalation
  - attack.t1548.003
logsource:
  product: linux
  service: sudo
detection:
  selection:
    User|startswith: 'svc-'
    Message|contains:
      - 'COMMAND=/bin/bash'
      - 'COMMAND=/bin/sh'
      - 'COMMAND=/usr/bin/bash'
  condition: selection
falsepositives:
  - Deployment tooling that legitimately shells out; filter by exact COMMAND.
level: high
